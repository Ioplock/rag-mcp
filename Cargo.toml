[package]
name = "rag-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rag-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
rmcp = { version = "0.6", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.22"
walkdir = "2"
glob = "0.3"
